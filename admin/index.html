<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>反馈管理 · Kepori</title>
  <link rel="icon" href="../assets/app-icon.png">
  <link rel="stylesheet" href="../styles.css?v=20261017-5">
  <link rel="stylesheet" href="./admin.css?v=20261017-5">
  <script type="module" src="./app.js?v=20261017-5"></script>
</head>
<body class="admin-body">
  <a class="skip-link" href="#main">跳到管理内容</a>
  <header class="header wrap"><a class="brand" href="../"><img src="../assets/app-icon.png" width="26" height="26" alt=""><span>Kepori</span><span class="brand-caption">反馈管理</span></a><nav aria-label="管理导航"><a class="quiet-link" href="../">公开反馈 ↗</a><button id="lock" class="text-button" hidden>退出</button></nav></header>
  <main id="main" class="wrap admin-main">
    <section id="login-panel" class="login-layout" aria-labelledby="login-title">
      <div class="login-card"><h1 id="login-title">反馈管理</h1>
        <form id="connect-form"><p class="subtle">首次连接 GitHub 私有反馈记录。</p>
          <label class="field" for="token">GitHub 管理密钥<input id="token" type="password" required autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
          <label class="check-row"><input id="remember" type="checkbox">在此设备加密保存</label>
          <div id="save-password-fields" hidden><label class="field" for="save-password">设置本机解锁密码<input id="save-password" type="password" minlength="10" autocomplete="new-password" placeholder="至少 10 位"></label><label class="field" for="confirm-password">再输入一次<input id="confirm-password" type="password" autocomplete="new-password"></label></div>
          <button class="button connect-button" type="submit">进入管理页</button>
          <details class="setup-help"><summary>如何获取管理密钥</summary><p>资源所有者选 Kepori-App，仅选择 feedback-admin 仓库。权限只需 Issues 读写、Metadata 只读。不要使用 Tally 密钥或网站发布密钥。</p><a id="create-token" class="text-link" href="https://github.com/settings/personal-access-tokens/new?name=Kepori%20Feedback%20Admin&amp;target_name=Kepori-App&amp;expires_in=365&amp;issues=write&amp;description=Browser%20admin%20for%20Kepori%20feedback-admin%20Issues%20only" target="_blank" rel="noopener noreferrer">打开 GitHub 配置页 ↗</a></details>
        </form>
        <form id="unlock-form" hidden><p class="subtle">输入此浏览器设置的本机密码。</p><label class="field" for="unlock-password">本机解锁密码<input id="unlock-password" type="password" required autocomplete="current-password"></label><button class="button connect-button" type="submit">解锁</button><button id="forget-device" class="text-button" type="button">忘记此设备，重新配置</button></form>
        <p id="login-message" class="notice" role="status" aria-live="polite" hidden></p><p class="login-footnote">密钥在本机加密保存，解锁密码不会上传。</p>
      </div>
    </section>
    <section id="workspace" hidden aria-labelledby="workspace-title">
      <div class="admin-heading"><div><h1 id="workspace-title">反馈管理</h1><p id="account-info" class="subtle"></p></div><div class="heading-actions"><button id="import" class="button secondary small">同步新反馈</button><button id="refresh" class="button secondary small">刷新</button></div></div>
      <div class="admin-nav"><div class="view-tabs" role="group" aria-label="管理内容"><button data-view="feedback" class="view-tab active" aria-pressed="true">反馈</button><button data-view="members" class="view-tab" aria-pressed="false">用户与发码</button></div><div id="metrics" class="admin-metrics" aria-label="管理统计"></div></div>
      <p id="workspace-message" class="notice" role="status" aria-live="polite" hidden></p>
      <div class="admin-grid"><section class="list-pane" aria-labelledby="list-title">
        <label class="search"><span aria-hidden="true">⌕</span><span class="sr-only">搜索反馈或联系邮箱</span><input id="admin-search" type="search" autocomplete="off" placeholder="搜索反馈或邮箱"></label>
        <div class="list-heading"><h2 id="list-title" class="sr-only">待确认的反馈</h2><label class="sr-only" for="admin-filter">筛选管理记录</label><select id="admin-filter"></select><span id="list-count" class="subtle"></span></div>
        <div id="admin-list" aria-busy="false"></div><button id="more" class="button secondary small" hidden>加载更多</button>
      </section><section id="inspector" class="inspector" aria-label="选中记录详情"></section></div>
    </section>
  </main>
  <footer class="footer wrap"><span>联系邮箱仅管理员可见。</span><div><a href="../">返回公开反馈</a></div></footer>
  <noscript><p class="wrap">请启用 JavaScript 使用管理页。</p></noscript>
</body>
</html>
